<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Garante que o site fique bom no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano</p>
  </header>

  <main class="conteudo">

    <!-- Área dos cards de resumo -->
    <section class="cards" id="cards">
      <!-- Os cards serão criados pelo JavaScript -->
    </section>

    <!-- Tabela de notas -->
    <section class="tabela-area">
      <h2>Notas por disciplina</h2>
      <div class="tabela-responsiva">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <!-- As linhas serão preenchidas pelo JavaScript -->
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
